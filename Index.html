<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculator Preț Print 3D</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101217;
  --panel: #171b22;
  --panel-strong: #1f252e;
  --field: #0d1016;
  --field-border: #2c3441;
  --line: #2b3340;
  --text: #f3f5f7;
  --muted: #9ba5b3;
  --soft: #cbd3dc;
  --accent: #4ade80;
  --accent-strong: #22c55e;
  --accent-dark: #052f1a;
  --warning: #f7c948;
  --shadow: 0 22px 70px rgba(0, 0, 0, .42);
  --radius: 8px;
}

* { box-sizing: border-box; }

body {
  min-height: 100vh;
  margin: 0;
  background:
    radial-gradient(circle at 18% 0%, rgba(74, 222, 128, .18), transparent 34%),
    linear-gradient(145deg, #0d0f14 0%, #151922 45%, #101217 100%);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding: 22px;
}

button, input { font: inherit; }

.shell {
  width: min(1120px, 100%);
  margin: 0 auto;
}

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  padding: 10px 0 18px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.mark {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border: 1px solid rgba(74, 222, 128, .38);
  border-radius: var(--radius);
  background: linear-gradient(145deg, rgba(74, 222, 128, .22), rgba(34, 197, 94, .08));
  color: var(--accent);
  font-weight: 800;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
}

h1 {
  margin: 0;
  font-size: clamp(26px, 4vw, 42px);
  line-height: 1.02;
}

.subtitle {
  margin-top: 8px;
  color: var(--muted);
  font-size: 14px;
}

.badge {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  padding: 7px 10px;
  border: 1px solid rgba(203, 211, 220, .16);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, .04);
  color: var(--soft);
  font-size: 13px;
  white-space: nowrap;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(340px, .85fr);
  gap: 18px;
  align-items: start;
}

.stack {
  display: grid;
  gap: 14px;
}

.card,
.summary {
  border: 1px solid rgba(203, 211, 220, .12);
  border-radius: var(--radius);
  background: rgba(23, 27, 34, .88);
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
}

.card { padding: 18px; }

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

h2 {
  margin: 0;
  font-size: 15px;
}

.hint {
  color: var(--muted);
  font-size: 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.field { min-width: 0; }
.field.full { grid-column: 1 / -1; }

label {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 13px;
}

.unit { color: #778292; }

input {
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid var(--field-border);
  border-radius: var(--radius);
  outline: none;
  background: linear-gradient(180deg, rgba(13, 16, 22, .98), rgba(13, 16, 22, .82));
  color: var(--text);
  transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
}

input::placeholder { color: #657181; }

input:focus {
  border-color: rgba(74, 222, 128, .8);
  box-shadow: 0 0 0 4px rgba(74, 222, 128, .12);
  background: #0c1016;
}

.time-grid,
.part-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
}

.part-row {
  grid-template-columns: minmax(0, 1.6fr) minmax(92px, .65fr) 42px;
  margin-bottom: 8px;
}

button {
  min-height: 44px;
  border: 1px solid rgba(203, 211, 220, .14);
  border-radius: var(--radius);
  background: #242b36;
  color: var(--text);
  cursor: pointer;
  transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
}

button:hover {
  transform: translateY(-1px);
  border-color: rgba(203, 211, 220, .28);
  background: #2c3542;
}

button:active { transform: translateY(0); }

.ghost-btn,
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 12px;
}

.ghost-btn {
  width: 100%;
  justify-content: space-between;
  background: rgba(255, 255, 255, .04);
}

.ghost-btn .chevron {
  color: var(--accent);
  transition: transform .18s ease;
}

.ghost-btn[aria-expanded="true"] .chevron {
  transform: rotate(180deg);
}

.icon-btn {
  width: 42px;
  padding: 0;
  color: var(--muted);
}

.add-btn {
  width: 100%;
  margin-top: 2px;
  color: var(--accent);
}

.accent {
  width: 100%;
  min-height: 52px;
  margin-top: 14px;
  border-color: rgba(74, 222, 128, .72);
  background: linear-gradient(180deg, var(--accent), var(--accent-strong));
  color: #04130a;
  font-weight: 800;
  box-shadow: 0 16px 36px rgba(34, 197, 94, .22);
}

.advanced-panel {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  padding-top: 14px;
}

.hidden { display: none; }

.summary {
  position: sticky;
  top: 22px;
  overflow: hidden;
}

.total-box {
  padding: 22px;
  background:
    linear-gradient(135deg, rgba(74, 222, 128, .2), rgba(247, 201, 72, .08)),
    var(--panel-strong);
  border-bottom: 1px solid rgba(203, 211, 220, .12);
}

.total-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--muted);
  font-size: 13px;
}

.result {
  margin-top: 10px;
  color: var(--accent);
  font-size: clamp(34px, 7vw, 56px);
  font-weight: 850;
  line-height: 1;
}

.summary-body { padding: 18px 22px 22px; }

.row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: 11px 0;
  border-bottom: 1px solid rgba(203, 211, 220, .1);
  color: var(--soft);
  font-size: 14px;
}

.row span:first-child { color: var(--muted); }
.row span:last-child { text-align: right; }
.row:last-child { border-bottom: 0; }

.toast {
  min-height: 20px;
  margin-top: 10px;
  color: var(--accent);
  font-size: 13px;
  text-align: center;
  opacity: 0;
  transition: opacity .18s ease;
}

.toast.show { opacity: 1; }

.footer {
  margin-top: 16px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

@media (max-width: 820px) {
  body { padding: 16px; }

  .topbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .layout { grid-template-columns: 1fr; }

  .summary {
    position: static;
    order: -1;
  }

  .advanced-panel { grid-template-columns: 1fr; }
}

@media (max-width: 560px) {
  .brand { align-items: flex-start; }

  .mark {
    width: 42px;
    height: 42px;
  }

  .grid,
  .time-grid {
    grid-template-columns: 1fr;
  }

  .part-row {
    grid-template-columns: minmax(0, 1fr) 86px 40px;
  }

  .card,
  .summary-body,
  .total-box {
    padding: 16px;
  }
}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">3D</div>
      <div>
        <h1>Calculator Preț Print 3D</h1>
        <div class="subtitle">STAS · Bambu P2S default · ofertă rapidă pentru client</div>
      </div>
    </div>
    <div class="badge">Print friendly</div>
  </header>

  <div class="layout">
    <section class="stack" aria-label="Date calcul">
      <div class="card">
        <div class="section-head">
          <h2>Print și material</h2>
          <span class="hint">Timp + filament</span>
        </div>

        <div class="grid">
          <div class="field full">
            <label>Durată printare <span class="unit">ore / minute</span></label>
            <div class="time-grid">
              <input id="h" type="number" min="0" placeholder="ore" inputmode="numeric">
              <input id="m" type="number" min="0" max="59" placeholder="minute" inputmode="numeric">
            </div>
          </div>

          <div class="field">
            <label for="grams">Filament <span class="unit">grame</span></label>
            <input id="grams" type="number" value="40" inputmode="decimal">
          </div>

          <div class="field">
            <label for="filamentCost">Cost filament <span class="unit">lei / kg</span></label>
            <input id="filamentCost" type="number" value="80" inputmode="decimal">
          </div>
        </div>
      </div>

      <div class="card">
        <button id="advancedToggle" class="ghost-btn" onclick="toggleAdvanced()" aria-expanded="false" aria-controls="advanced">
          <span>Curent & mentenanță</span>
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>
        <div id="advanced" class="advanced-panel hidden">
          <div class="field">
            <label for="powerCost">Consum electric <span class="unit">lei / ora</span></label>
            <input id="powerCost" type="number" step="0.1" value="1.2" inputmode="decimal">
          </div>

          <div class="field">
            <label for="printerPrice">Preț imprimantă <span class="unit">lei</span></label>
            <input id="printerPrice" type="number" value="6000" inputmode="decimal">
          </div>

          <div class="field">
            <label for="printerHours">Viață estimată <span class="unit">ore</span></label>
            <input id="printerHours" type="number" value="10000" inputmode="decimal">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-head">
          <h2>Manoperă și piese</h2>
          <span class="hint">Costuri extra</span>
        </div>

        <div class="grid">
          <div class="field full">
            <label for="labor">Manoperă <span class="unit">lei</span></label>
            <input id="labor" type="number" value="10" inputmode="decimal">
          </div>
        </div>

        <label>Alte costuri <span class="unit">piese</span></label>
        <div id="parts"></div>
        <button class="add-btn" onclick="addPart()">+ Adaugă piesă</button>
      </div>
    </section>

    <aside class="summary" aria-label="Rezultat calcul">
      <div class="total-box">
        <div class="total-label">
          <span>Total estimat</span>
          <span id="durationLabel">0h 0m</span>
        </div>
        <div id="rTotal" class="result">0</div>
      </div>

      <div class="summary-body">
        <div class="row"><span>Filament</span><span id="rMaterial">0</span></div>
        <div class="row"><span>Curent</span><span id="rPower">0</span></div>
        <div class="row"><span>Mentenanță</span><span id="rMaintenance">0</span></div>
        <div class="row"><span>Manoperă</span><span id="rLabor">0</span></div>
        <div class="row"><span>Piese</span><span id="rExtras">0</span></div>

        <button class="accent" onclick="exportText()">Export pentru client</button>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </div>
    </aside>
  </div>

  <div class="footer">by @mhpetcu</div>
</main>

<script>
function toggleAdvanced(){
  const advanced = document.getElementById('advanced');
  const toggle = document.getElementById('advancedToggle');
  advanced.classList.toggle('hidden');
  toggle.setAttribute('aria-expanded', String(!advanced.classList.contains('hidden')));
}

function addPart(){
  const div=document.createElement('div');
  div.className='part-row';
  div.innerHTML=`<input placeholder="ex: 3x șurub M3"><input type="number" placeholder="lei" inputmode="decimal"><button class="icon-btn" title="Șterge piesa" onclick="this.parentNode.remove();calc()">×</button>`;
  document.getElementById('parts').appendChild(div);
  div.querySelectorAll('input').forEach(input => input.addEventListener('input', calc));
}

function calc(){
  const h = +document.getElementById('h').value || 0;
  const m = +document.getElementById('m').value || 0;
  const hours = h + m/60;

  const gramsVal = +document.getElementById('grams').value || 0;
  const filamentKg = +document.getElementById('filamentCost').value || 0;
  const power = +document.getElementById('powerCost').value || 0;
  const printerPriceVal = +document.getElementById('printerPrice').value || 0;
  const printerHoursVal = +document.getElementById('printerHours').value || 1;
  const laborVal = +document.getElementById('labor').value || 0;

  let extras = 0;
  document.querySelectorAll('#parts input[type=number]').forEach(i=>extras += (+i.value || 0));

  const material = gramsVal * (filamentKg / 1000);
  const powerCostVal = hours * power;
  const maintenance = hours * (printerPriceVal / printerHoursVal);
  const total = material + powerCostVal + maintenance + laborVal + extras;

  rMaterial.textContent = `${material.toFixed(2)} lei (${gramsVal} g)`;
  rPower.textContent = powerCostVal.toFixed(2) + ' lei';
  rMaintenance.textContent = maintenance.toFixed(2) + ' lei';
  rLabor.textContent = laborVal.toFixed(2) + ' lei';
  rExtras.textContent = extras.toFixed(2) + ' lei';
  rTotal.textContent = total.toFixed(2) + ' lei';
  durationLabel.textContent = `${h}h ${m}m`;
}

function showToast(message){
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>toast.classList.remove('show'), 2400);
}

function exportText(){
  calc();
  const h = +document.getElementById('h').value || 0;
  const m = +document.getElementById('m').value || 0;
  const duration = `${h}h ${m}m`;

  let partsText = '';
  let partsSubtotal = 0;
  document.querySelectorAll('#parts .part-row').forEach(item=>{
    const name = item.querySelector('input[type=text], input:not([type=number])').value || 'Piesă';
    const price = +item.querySelector('input[type=number]').value || 0;
    partsSubtotal += price;
    partsText += `- ${name}: ${price.toFixed(2)} lei\n`;
  });

  const otherCosts = (
    parseFloat(rPower.textContent) + parseFloat(rMaintenance.textContent)
  ).toFixed(2);

  const text = `OFERTĂ PRINT 3D\n----------------\nDurată print: ${duration}\nFilament: ${rMaterial.textContent}\nAlte costuri: ${otherCosts} lei\nManoperă: ${rLabor.textContent}\n\nPiese:\n${partsText || '-'}Subtotal piese: ${partsSubtotal.toFixed(2)} lei\n----------------\nTotal print: ${rTotal.textContent}`;

  navigator.clipboard.writeText(text);
  showToast('Export copiat - gata de print termic');
}

['h','m','grams','filamentCost','powerCost','printerPrice','printerHours','labor']
.forEach(id=>document.getElementById(id).addEventListener('input', calc));

calc();
</script>
</body>
</html>
